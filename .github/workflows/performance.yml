name: Performance

# Runs weekly, and on the day a new OpenLint release appears on npm.
on:
  push:
    branches: [main]
    paths: ["site/**"]   # site changes redeploy without re-running the benchmark
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if nothing changed
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: performance
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      ran: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run today?
        id: check
        run: |
          latest=$(npm view openlint version)
          known=$(node -e "try{console.log(require('./results/latest.json').tools.includes('openlint@$latest'))}catch{console.log(false)}")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$known" != "true" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Running (openlint $latest, already benchmarked: $known)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Nothing new: openlint $latest already benchmarked"
          fi
      - if: steps.check.outputs.run == 'true'
        run: npm ci || npm i
      - if: steps.check.outputs.run == 'true'
        run: npm run fetch && npm run tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.check.outputs.run == 'true'
        run: npm run bench
      - name: Commit results
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Benchmark run $(date -u +%Y-%m-%d)" && git push || echo "No changes"

  deploy:
    needs: bench
    if: needs.bench.outputs.ran == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: cp results/latest.json results/history.jsonl site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
